name: 红利盘中估算

# 交易日下午先用实时价算出红利低波100 今天的评分，重画每日分享图（盘中版）；晚上收盘后正式更新会盖过它。
# GitHub 定时常晚几个小时，所以设三次，哪次先在北京时间 13:00~15:00 跑到就用哪次（脚本里判断时间，不在时间段直接跳过）。
on:
  schedule:
    - cron: "47 4 * * 1-5"    # 北京时间 12:47
    - cron: "23 5 * * 1-5"    # 北京时间 13:23
    - cron: "53 5 * * 1-5"    # 北京时间 13:53
  workflow_dispatch:
    inputs:
      force:
        description: "不看时间段，直接估算"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 盘中估算
        id: est
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          set +e
          python scripts/intraday.py
          c=$?
          if [ $c -eq 0 ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; elif [ $c -ne 3 ]; then exit $c; fi

      - name: 重画每日分享图
        if: steps.est.outputs.ok == '1'
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
          python scripts/share.py --live

      - name: 提交
        if: steps.est.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividend_live.json data/share/
          git commit -m "红利盘中估算 $(TZ=Asia/Shanghai date '+%F %H:%M')" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
