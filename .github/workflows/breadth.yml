name: 月度市场宽度与集中度

on:
  schedule:
    - cron: "20 11 1,2,3 * *"   # 北京时间每月 1~3 日 19:20（月初多跑两次，防止某次失败）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 抓取这一份股票的月线
        run: python scripts/breadth_fetch.py ${{ matrix.shard }} 4 shard_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.json
          retention-days: 3

  combine:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: 合并、计算并提交（和每日更新撞车时拉最新再算一遍）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for k in 1 2 3 4 5; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            python scripts/breadth_combine.py shards
            git add data/raw/breadth_monthly.json data/raw/stock_prev12.json
            if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
            git commit -q -m "月度市场宽度与集中度 $(TZ=Asia/Shanghai date '+%F')"
            git push -q origin HEAD:${{ github.ref_name }} && exit 0
            sleep 20
          done
          exit 1
