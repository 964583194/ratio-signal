name: probe-tidy
on:
  push:
    branches: [tidy]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q akshare
      - run: python scripts/_bk_check.py
