name: probe-funds
on:
  push:
    branches: [probe-funds]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q akshare
      - run: python probe/funds.py
