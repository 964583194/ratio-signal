name: 更新比值数据

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 北京时间工作日 17:30
    - cron: "0 1 * * 6"      # 北京时间周六 09:00，补红利低波100 隔日发布的数据
  workflow_dispatch:          # 可在 Actions 页面手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取数据并计算
        run: python scripts/update.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据没有变化"
          else
            git commit -m "数据更新 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: 数据源体检（有数据长期没更新时让任务失败，GitHub 会发邮件提醒）
        run: python -c "import json,sys; h=json.load(open('data/health.json')); bad=[v['name']+'（'+str(v.get('stale_days'))+' 天）' for v in h['items'].values() if not v.get('stale_days') is not None or v['stale_days']>12]; print('需要处理：'+'、'.join(bad) if bad else '全部正常'); sys.exit(1 if bad else 0)"
