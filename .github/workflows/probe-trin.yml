name: probe-trin
on:
  push:
    branches: [probe-trin]
    paths: [probe/**, .github/workflows/probe-trin.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python probe/trin_fetch.py ${{ matrix.shard }} 8 probe/shards/shard_${{ matrix.shard }}.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: probe/shards/shard_${{ matrix.shard }}.json
          retention-days: 2
  combine:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - run: |
          mkdir -p probe/shards; cp dl/*/*.json probe/shards/ || true
          python probe/trin_combine.py probe/shards
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/breadth_daily.csv probe/shards
          git commit -q -m "探针：日频宽度原始数据"
          git push -q origin HEAD:probe-trin
