<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的基金</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#16294a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="交易系统">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="几个指数的定投信号，每个交易日自动更新">
<link rel="stylesheet" href="style.css?v=5">
</head><body><div class="wrap">
<header class="top"><div class="eyebrow">交易系统 · 我的基金</div><h1>我的基金 · 能不能加</h1>
<p>名单里只有基金名称，不含金额 · <span id="cnt">—</span> 只 · 数据 <span class="num" id="upd">—</span> · <a href="./">← 回交易系统</a></p></header>
<section class="panel"><h2>现在怎么样</h2><div id="sum"><div class="note">加载中</div></div></section>
<div id="groups" style="display:flex;flex-direction:column;gap:16px"></div>
<div id="osBox" style="display:flex;flex-direction:column;gap:16px"></div>
<section class="panel"><h2>这几个结论准不准</h2><div id="ev"></div></section>
<footer>海外小仓位的提醒规则和走势在最下面。名单在仓库的 data/myfunds_list.json（只有代码和名称），增减基金改那里或告诉 Claude。只作提醒，不构成投资建议。</footer>
</div>
<script src="charts.js?v=6"></script>
<script>
(function(){
const $=id=>document.getElementById(id),pc=(x,d=0)=>(x*100).toFixed(d)+"%",sg=(x,d=0)=>x==null?"—":(x>0?"+":"")+pc(x,d);
// ---------------- 海外小仓位（只作提醒）
const pc1=(x,d=1)=>(x*100).toFixed(d)+"%";
function renderOS(){
  const root=$("osBox");root.innerHTML=`<section class="panel"><div class="note">加载中</div></section>`;
  fetch("data/overseas.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(r.status===404?"还没有生成数据，下次自动更新后会出现":"HTTP "+r.status);return r.json()}).then(d=>{
    
    
    const tag=(cls,t)=>`<span class="lv ${cls}">${t}</span>`;
    const ndx=d.ndx?`<tr><td><a href="./#ndx">纳指100</a><div class="note" style="margin:2px 0 0">定投中 · ${d.ndx.date}</div></td><td class="r num">${pc1(d.ndx.dd)}</td><td>${tag(d.ndx.dd>=.2?"g1":"c0",d.ndx.zone)}<div style="margin-top:4px">${d.ndx.action}</div></td></tr>`:"";
    const rows=d.funds.map(f=>{const L=f.latest;return `<tr><td><a href="#overseas" onclick="event.preventDefault();document.getElementById('os_${f.code}').scrollIntoView({behavior:'smooth'})">${f.name}</a><div class="note" style="margin:2px 0 0">${f.code} · ${L.date}</div></td><td class="r num">${pc1(L.dd)}</td><td>${tag(L.cls,L.zone)}<div style="margin-top:4px">${L.action}</div></td></tr>`}).join("");
    const pr=d.premium;
    root.innerHTML=
      `<section class="panel" id="os"><h2>海外小仓位：规则和走势</h2>
        <div class="scroll"><table class="otbl"><thead><tr><th>基金</th><th class="r">离最高点</th><th>结论</th></tr></thead><tbody>${rows}${ndx}</tbody></table></div>
        <p class="note">用累计净值算（分红加回）。这几只是小仓位，不进定投组合，也不占比例；结论只是提醒，不是买卖信号。</p>
        ${d.corr_tech!=null?`<p class="note" style="margin-top:6px">浦银全球智能科技 和 建信新兴市场混合 近一年周涨跌相关性 <b class="num">${d.corr_tech.toFixed(2)}</b>${d.corr_tech>=.8?"：基本是同一类资产，往这块加钱时没必要两只都加。":d.corr_tech>=.6?"：重合较多。":"。"}</p>`:""}
        ${pr?`<p class="note" style="margin-top:6px">亚太精选场内 ETF（159687）${pr.date} 溢价 <b class="num">${sg(pr.value)}</b>：${pr.value>.05?"溢价太高，不买场内，买场外联接（021189 / 021190）。":pr.value>.03?"略高，优先买场外联接。":"正常，场内场外都可以。"}</p>`:""}
      </section>`+
      d.funds.map(f=>{const L=f.latest,b=f.bt;return `<section class="panel" id="os_${f.code}"><h2>${f.name} <span class="note" style="font-weight:400">${f.code}</span></h2>
        <p class="note" style="margin:-6px 0 8px">${f.desc}</p>
        <div>${tag(L.cls,L.zone)} <span style="margin-left:6px">${L.action}</span></div>
        <div class="kv"><div><div class="label">累计净值</div><div class="v">${L.nav.toFixed(4)}</div></div><div><div class="label">离最高点</div><div class="v">${pc1(L.dd)}</div><div class="s">历史最深 ${pc1(L.hist_mdd)}</div></div><div><div class="label">偏离年线</div><div class="v">${sg(L.dev)}</div></div><div><div class="label">近一年</div><div class="v">${sg(L.ret1y)}</div></div></div>
        <h3 style="font-size:14px;margin:14px 0 4px">累计净值与年线</h3>
        <p class="note" style="margin:0 0 6px"><span style="color:var(--ink);font-weight:700">——</span> 累计净值　<span style="color:var(--grow);font-weight:700">- - -</span> 年线（250 日均线）　<span style="color:var(--mark);font-weight:700">· · ·</span> 过热线（年线 +25%，净值到这里以上暂停加钱）</p>
        <div class="ranges" role="group" aria-label="时间范围" data-for="os_c_${f.code}"><button type="button" data-r="1y">近1年</button><button type="button" data-r="3y" aria-pressed="true">近3年</button><button type="button" data-r="all">全部</button></div>
        <div class="chartwrap"><svg class="chart" id="os_c_${f.code}" viewBox="0 0 720 200" role="img" style="touch-action:pan-y"></svg><div class="tip" hidden></div></div>
        ${b?`<p class="note">回测（${b.start} 起，每周 1000 元）：普通定投年化 <b>${b.plain.xirr==null?"—":pc1(b.plain.xirr)}</b>、最大回撤 ${pc1(b.plain.mdd)}；按提醒规则（过热暂停、回撤 ≥20% 买 2 倍，没买的钱放现金）年化 <b>${b.rule.xirr==null?"—":pc1(b.rule.xirr)}</b>、最大回撤 ${pc1(b.rule.mdd)}${b.rule.xirr!=null&&b.plain.xirr!=null?(b.rule.xirr>b.plain.xirr+.005?"，规则略好。":b.rule.xirr<b.plain.xirr-.005?"，规则不如普通定投，结论只作参考。":"，两者差不多。"):"。"}</p>`:`<p class="note">成立时间太短，暂时没有回测。</p>`}
      </section>`}).join("")+
      `<section class="panel rules"><h2>规则速查</h2><div class="scroll"><table><tbody>
        <tr><td>偏离年线 &gt; +25%</td><td>过热，暂停加钱，已有的不动（和黄金页同一条规则）</td></tr>
        <tr><td>离最高点 ≥ 20%</td><td>大幅回撤，有余钱可以多加；≥30% 深度回撤</td></tr>
        <tr><td>离最高点 10%~20%</td><td>回调，照常持有</td></tr>
        <tr><td>亚太精选场内溢价 &gt; 5%</td><td>不买场内 159687，买场外联接</td></tr>
        <tr><td>主动管理基金</td><td>连续两年明显跑输同类或大盘，考虑换成指数基金</td></tr>
      </tbody></table></div></section>`;
    d.funds.forEach(f=>{
      const nav=f.nav_series||[],ma=[],hot=[];let sum=0;
      nav.forEach(([dt,v],i)=>{sum+=v;if(i>=250)sum-=nav[i-250][1];if(i>=249){ma.push([dt,sum/250]);hot.push([dt,sum/250*1.25])}});
      const mm=new Map(ma),dm=new Map(f.series);
      const c=LineChart($("os_c_"+f.code),{W:720,H:220,range:"3y",overlays:[{data:ma,c:"var(--grow)",dash:"6 4",w:1.4},{data:hot,c:"var(--mark)",dash:"2 4",w:1.2}]});
      c.set(nav,{tip:(dt,v)=>{const m=mm.get(dt);return `${dt}<br>累计净值 <b>${v.toFixed(4)}</b>`+(m?`<br>年线 ${m.toFixed(4)}（${v>=m?"高":"低"} ${pc1(Math.abs(v/m-1))}）`:"")+(dm.has(dt)?`<br>离最高点 ${(-dm.get(dt)).toFixed(1)}%`:"")}})});
  }).catch(e=>{root.innerHTML=`<section class="panel err"><h2>读取数据失败</h2><p class="note">${e.message}</p></section>`});
}

let D=null,FIL="all";
function spark(v){if(!v||v.length<2)return"";const lo=Math.min(...v),hi=Math.max(...v),W=64,H=28,X=i=>i/(v.length-1)*W,Y=y=>H-2-(y-lo)/((hi-lo)||1)*(H-4);
  const up=v[v.length-1]>=v[0];return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${v.map((y,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(y).toFixed(1)).join("")}" fill="none" stroke="${up?"var(--mark)":"var(--grow)"}" stroke-width="1.4"/></svg>`}
function row(r){const L=D.labels[r.tag],tg=[];
  if(r.sys)tg.push("系统里有信号");if(r.young)tg.push("成立不到一年，仅供参考");
  if(r.ex2y!=null&&r.ex2y<-.2)tg.push(`<span class="w">近两年跑输沪深300 ${pc(-r.ex2y)}，考虑换成指数</span>`);
  if(r.note)tg.push(`<span class="w">${r.note}</span>`);
  return `<div class="frow" data-t="${r.tag}"><div class="nm">${r.name}<small>${r.code}</small></div>${spark(r.spark)}
    <div class="meta">离最高点 ${r.dd==null?"—":pc(r.dd)} · 偏离年线 ${r.dev==null?"—":sg(r.dev)}</div>
    <div class="rs"><span class="lv ${L[1]}">${L[0]}</span>${r.page?`<a href="${r.page.startsWith("#")?r.page:"./#"+r.page}" style="color:var(--ink)">${r.reason}</a>`:r.reason}</div>
    ${tg.length?`<div class="tg">${tg.map(t=>t.startsWith("<")?t:`<span>${t}</span>`).join("")}</div>`:""}</div>`}
function draw(){
  const G={};D.funds.forEach(r=>(G[r.group]=G[r.group]||[]).push(r));
  $("groups").innerHTML=Object.entries(G).map(([g,rs])=>{const show=rs.filter(r=>FIL==="all"||r.tag===FIL);if(!show.length)return"";
    const sim=D.group_sim[g],c={};rs.forEach(r=>c[r.tag]=(c[r.tag]||0)+1);
    return `<section class="panel"><h2>${g} <span class="note" style="font-weight:400">${rs.length} 只 · ${Object.entries(c).map(([k,n])=>D.labels[k][0]+" "+n).join(" · ")}</span></h2>
      ${g==="系统内"?`<p class="gsim">这些在交易系统里有自己的规则，结论和对应页签一致，点原因可以跳过去。</p>`:g==="海外小仓位"?`<p class="gsim">小仓位 QDII，按自己的提醒规则（过热暂停、回撤大可多加），规则和每只的走势见本页最下面${sim!=null?`；同组相关 <b>${sim.toFixed(2)}</b>`:""}。</p>`:sim!=null?`<p class="gsim">同组近一年周涨跌平均相关 <b>${sim.toFixed(2)}</b>：${sim>=.75?"<b>走势基本一样，是同一类资产，不需要每只都留</b>":sim>=.6?"走势比较接近，重合较多":"走势差别较大"}。</p>`:""}
      ${show.map(row).join("")}</section>`}).join("");
}
fetch("data/myfunds.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{D=d;
  $("cnt").textContent=d.funds.length;$("upd").textContent=d.updated;
  const add=d.funds.filter(r=>r.tag==="add"),sysAdd=add.filter(r=>r.sys),othAdd=add.filter(r=>!r.sys),wait=d.funds.filter(r=>r.tag==="wait"&&!r.sys);
  const ins=add.length?`要加钱，优先加：${add.map(r=>r.name.replace(/ETF联接|\(QDII\)|混合|股票|指数|[AC]$/g,"")).join("、")}。`:"现在没有“可以加”的基金，按原计划定投就好。";
  $("sum").innerHTML=`<div class="insight">${ins}${wait.length?` 有 ${wait.length} 只主题基金还在下跌趋势里，先别补。`:""}</div>
    <p class="note" style="margin-top:6px">市场温度：${d.zone_verdict||"—"}</p>
    <div class="sum4">${Object.entries(d.labels).map(([k,[t,c]])=>`<button type="button" data-f="${k}"><span class="lv ${c}">${t}</span><span class="v">${d.count[k]}</span></button>`).join("")}</div>
    <p class="note">点上面的格子只看这一类，再点一次看全部。</p>`;
  $("sum").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{FIL=FIL===b.dataset.f?"all":b.dataset.f;
    $("sum").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f===FIL));draw()}));
  draw();renderOS();
  const S=d.stats,er=k=>{const v=S[k];return v?`<tr><td><span class="lv ${d.labels[k]?d.labels[k][1]:"c0"}">${d.labels[k]?d.labels[k][0]:"全部日子"}</span></td><td class="r num">${sg(v.avg,1)}</td><td class="r num">${pc(v.up)}</td><td class="r num">${pc(v.dd,1)}</td></tr>`:""};
  $("ev").innerHTML=`<p class="note" style="margin:-6px 0 8px">把这 ${S.all.funds} 只基金的每个交易日都按当时的状态贴上标签（共 ${S.all.days.toLocaleString()} 天），看之后半年（120 个交易日）怎么走：</p>
    <div class="scroll"><table><thead><tr><th>当时的结论</th><th class="r">之后半年平均</th><th class="r">上涨的比例</th><th class="r">期间最多再跌</th></tr></thead><tbody>${["add","hold","wait","cut"].map(er).join("")}${er("all")}</tbody></table></div>
    <p class="concl"><b>结论：</b>“先别加”的时候之后半年上涨的比例只有 ${pc(S.wait.up)}，期间平均再跌 ${pc(-S.wait.dd,1)}，明显比其他时候差，<b>跌多了就补正是越补越亏的原因</b>；跌深以后等站回年线再加，表现更好。“可以减”只在市场偏热 / 顶部时才给，之后最多再跌 ${pc(-S.cut.dd)}。</p>
    <p class="note">规则：比年线高 25% 以上且市场在偏热 / 顶部区 → 可以减；涨太急、下跌趋势（年线下且年线向下）或市场偏热 → 先别加；站回年线且离最高点 20% 以上 → 可以加；其余照常。这些基金大多 2021~2025 年才成立，样本主要是这几年，只作参考。</p>`;
}).catch(e=>{$("sum").innerHTML=`<div class="note">读取失败：${e.message}</div>`});
})();
</script>
</body></html>
