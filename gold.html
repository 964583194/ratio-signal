(function(){
const $=id=>document.getElementById(id),pc=(x,d=0)=>(x*100).toFixed(d)+"%",sg=(x,d=1)=>x==null?"—":(x>0?"+":"")+pc(x,d);
const big=(id,t)=>`<button type="button" class="bigbtn" data-big="${id}" data-title="${t}">⤢ 横屏看大图</button>`;
const box=(id,h)=>`<div class="chartwrap"><svg class="chart" id="${id}" viewBox="0 0 720 ${h}" role="img" style="touch-action:pan-y"></svg><div class="tip" hidden></div></div>`;
function ticks(lo,hi,n=5){const st=niceStep((hi-lo)*(5/n));const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(6));return t}
const h6=v=>v&&v["120"]?`${sg(v["120"].avg)}<br><small>上涨 ${pc(v["120"].up)}</small>`:"—";
fetch("data/goldmodel.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(d=>{
  const L=d.latest,Lt=L.lights,S=d.series,T=d.stats,E=d.outflow_episodes;$("upd").textContent=d.updated;
  const dates=S.map(r=>r[0]),px=S.map(r=>r[1]),ma=S.map(r=>r[2]),sp=S.map(r=>r[3]),vol=S.map(r=>r[4]),ry=S.map(r=>r[5]);
  const sp60=sp.map((v,i)=>i>=60&&v&&sp[i-60]?(v/sp[i-60]-1)*100:null);
  const lv=(t,c)=>`<span class="lv ${c}">${t}</span>`;
  $("now").innerHTML=`<div class="verdict">${L.verdict}</div>
    <div class="g4">
      <div><span class="t">价格（定投规则）</span><div class="v">${pc(L.dd)}</div>${lv(L.rule_zone||"—",L.dd<=-.15?"g1":L.dev250>.25?"h1":"c0")}<div class="s">离最高点；比年线 ${sg(L.dev250)} → ${L.rule}</div></div>
      <div><span class="t">ETF 资金（近 60 日）</span><div class="v">${sg(Lt.outflow.value)}</div>${lv(Lt.outflow.on?"恐慌撤出":"没有撤出",Lt.outflow.on?"g1":"c0")}<div class="s">SPDR 持仓 ${Lt.outflow.tons?Lt.outflow.tons.toFixed(0):"—"} 吨；减少 ≥8% 才亮</div></div>
      <div><span class="t">趋势（10 个月均线）</span><div class="v">${sg(Lt.trend.dev)}</div>${lv(Lt.trend.up?"均线上方":"均线下方",Lt.trend.up?"g1":"h1")}<div class="s">${Lt.trend.up?"趋势向上":"趋势还在走弱"}</div></div>
      <div><span class="t">波动率（20 日年化）</span><div class="v">${Lt.vol.value==null?"—":pc(Lt.vol.value)}</div>${lv(Lt.vol.hot?"很大":Lt.vol.pct>=.8?"偏高":"正常",Lt.vol.hot?"r1":Lt.vol.pct>=.8?"h1":"c0")}<div class="s">近 5 年 ${Lt.vol.pct==null?"—":pc(Lt.vol.pct)} 分位；长期平均约 15%</div></div>
    </div>
    <p class="note">规则不变：回撤 ≥15% 买 2 倍，比年线高 25% 以上暂停。这一页只帮你判断“现在是什么性质的下跌、要不要多掏钱”。</p>`;
  // ① 资金
  const o=T.outflow,a=T.all,win=E.filter(e=>e.r120!=null&&e.r120>0).length,done=E.filter(e=>e.r120!=null).length;
  $("s1").innerHTML=`<p class="note" style="margin:-6px 0 8px">全球最大的黄金 ETF（SPDR GLD）持仓吨数，60 个交易日减少 8% 以上，说明大资金在恐慌撤出。历史上这往往是好买点。</p>
    <h3 class="h3" style="margin-top:0">持仓 60 日变化与金价${big("g_c1","SPDR 持仓 60 日变化（左轴 %）与黄金ETF（右轴）")}</h3>
    <p class="note" style="margin:0 0 6px"><span style="color:var(--grow);font-weight:700">——</span> 持仓 60 日变化（%，左轴；绿色区 ≤−8% 恐慌撤出）　<span style="color:var(--ink);font-weight:700">——</span> 黄金ETF（右轴）</p>${box("g_c1",230)}
    <p class="concl"><b>结论：</b>现在近 60 日 ${sg(Lt.outflow.value)}，${Lt.outflow.on?"<b>正在恐慌撤出</b>":"没有恐慌撤出"}。2014 年以来出现过 ${E.length} 次，${done} 次里有 ${win} 次之后半年上涨；撤出期间之后半年平均 ${sg(o["120"].avg)}、期间平均最多再跌只有 ${pc(-o.dd,1)}（平时 ${pc(-a.dd,1)}）。反过来，资金涌入（增加 ≥8%）之后半年只有 ${sg(T.inflow["120"].avg)}。<b>→ ${Lt.outflow.on?"有余钱可以比 2 倍再多加一些":"等它亮了再考虑额外加钱"}。</b></p>
    <div class="scroll" style="margin-top:8px"><table><thead><tr><th>撤出时段</th><th class="r">之后半年</th><th class="r">期间最多再跌</th></tr></thead><tbody>
    ${E.slice().reverse().map(e=>`<tr><td class="num">${e.from.slice(0,7)}${e.to.slice(0,7)!==e.from.slice(0,7)?"~"+e.to.slice(0,7):""}</td><td class="r num">${sg(e.r120,0)}</td><td class="r num">${e.dn==null?"—":pc(e.dn)}</td></tr>`).join("")}</tbody></table></div>`;
  const lt1=ticks(Math.min(...sp60.filter(v=>v!=null)),Math.max(...sp60.filter(v=>v!=null)));
  DualChart($("g_c1"),{W:720,H:230,dates,leftRange:[lt1[0],lt1[lt1.length-1]],leftTicks:lt1,leftFmt:v=>v+"%",bands:[{from:lt1[0],to:-8,fill:"var(--grow-soft)"}],
    left:[{v:sp60,c:"var(--grow)",w:1.5}],right:{v:px,c:"var(--ink)"},tip:i=>`${dates[i]}<br>SPDR 持仓 ${sp[i]?sp[i].toFixed(0)+" 吨":"—"}<br>60 日变化 <b>${sp60[i]==null?"—":(sp60[i]>0?"+":"")+sp60[i].toFixed(1)+"%"}</b><br>黄金ETF ${px[i].toFixed(3)}`});
  // ② 趋势
  const tm=T.timing;
  $("s2").innerHTML=`<p class="note" style="margin:-6px 0 8px">经典的趋势跟踪：价格在 10 个月（210 个交易日）均线上方算趋势向上。黄金的“动量”是今年解释金价涨跌最多的一项（世界黄金协会归因模型里占 24%）。</p>
    <h3 class="h3" style="margin-top:0">黄金ETF 与 10 个月均线${big("g_c2","黄金ETF 与 10 个月均线")}</h3>
    <p class="note" style="margin:0 0 6px"><span style="color:var(--ink);font-weight:700">——</span> 黄金ETF　<span style="color:var(--div);font-weight:700">- - -</span> 10 个月均线（同一左轴）　<span style="color:var(--muted);font-weight:700">——</span> SPDR 持仓（吨，右轴）</p>${box("g_c2",240)}
    <p class="concl"><b>结论：</b>现在在均线${Lt.trend.up?"上方":"下方"} ${sg(Lt.trend.dev)}。在均线上方时，之后半年平均 ${sg(T.above["120"].avg)}（上涨 ${pc(T.above["120"].up)}）；下方时 ${sg(T.below["120"].avg)}（上涨 ${pc(T.below["120"].up)}）。但“上方持有、下方空仓”年化 ${pc(tm.trend.cagr,1)}，不如一直拿着的 ${pc(tm.hold.cagr,1)}，所以<b>只用来看方向，不用来买卖</b>。<b>→ ${Lt.trend.up?"趋势向上，规则照常":"趋势还在走弱，2 倍照做但别急着追加"}。</b></p>`;
  const lt2=ticks(Math.min(...px),Math.max(...px));
  DualChart($("g_c2"),{W:720,H:240,dates,leftRange:[lt2[0],lt2[lt2.length-1]],leftTicks:lt2,leftFmt:v=>v.toFixed(v<10?1:0),
    left:[{v:px,c:"var(--ink)",w:1.5},{v:ma,c:"var(--div)",w:1.6,dash:"6 4"}],right:{v:sp,c:"var(--muted)"},tip:i=>`${dates[i]}<br>黄金ETF <b>${px[i].toFixed(3)}</b><br>10 个月均线 ${ma[i]==null?"—":ma[i].toFixed(3)}（${ma[i]?sg(px[i]/ma[i]-1):"—"}）<br>SPDR ${sp[i]?sp[i].toFixed(0)+" 吨":"—"}`});
  // ③ 波动
  $("s3").innerHTML=`<p class="note" style="margin:-6px 0 8px">20 个交易日的年化波动率。黄金长期平均约 15%，今年一度超过 50%。波动很大时说明市场还没稳定，买入后短期再跌的幅度会更大。</p>
    <h3 class="h3" style="margin-top:0">波动率与黄金ETF${big("g_c3","黄金ETF 20 日年化波动率（左轴 %）与黄金ETF（右轴）")}</h3>
    <p class="note" style="margin:0 0 6px"><span style="color:var(--mark);font-weight:700">——</span> 波动率（%，左轴；红色区 ≥30%）　<span style="color:var(--ink);font-weight:700">——</span> 黄金ETF（右轴）</p>${box("g_c3",220)}
    <p class="concl"><b>结论：</b>现在 ${Lt.vol.value==null?"—":pc(Lt.vol.value)}，在近 5 年 ${pc(Lt.vol.pct)} 分位，${Lt.vol.hot?"很大":Lt.vol.pct>=.8?"偏高":"正常"}。波动很大（≥30% 或 90% 分位以上）之后，半年内平均最多再跌 ${pc(-T.vol_hot.dd,1)}，平时 ${pc(-a.dd,1)}；但之后涨跌各半，不能用来判断方向。<b>→ ${Lt.vol.hot?"还没稳定，分批买，别一次加满":"不用特别担心"}。</b></p>`;
  const vv=vol.map(v=>v==null?null:v*100),lt3=ticks(0,Math.max(...vv.filter(v=>v!=null)));
  DualChart($("g_c3"),{W:720,H:220,dates,leftRange:[0,lt3[lt3.length-1]],leftTicks:lt3,leftFmt:v=>v+"%",bands:[{from:30,to:lt3[lt3.length-1],fill:"var(--mark-soft)"}],
    left:[{v:vv,c:"var(--mark)",w:1.3}],right:{v:px,c:"var(--ink)"},tip:i=>`${dates[i]}<br>波动率 <b>${vv[i]==null?"—":vv[i].toFixed(0)+"%"}</b><br>黄金ETF ${px[i].toFixed(3)}`});
  // ④ 不用的
  const rc=T.real_corr,R=L.ref;
  $("s4").innerHTML=`<p><b>实际利率</b>（美国 10 年期通胀保值国债收益率，现在 ${R.real10==null?"—":R.real10.toFixed(2)+"%"}，近 3 个月 ${R.real10_chg3m==null?"—":(R.real10_chg3m>0?"+":"")+R.real10_chg3m}）</p>
    <p class="note" style="margin-top:0">过去最常用的黄金模型：实际利率越高，持有黄金的机会成本越高，金价越弱。2013~2020 年两者同期 3 个月变化的相关系数是 ${rc["2013-2020"]}（很强），2022 年后只剩 ${rc["2022-2026"]}；而且它对之后的走势几乎没有预测力。2022 年起各国央行大量买金，实际利率很高的这几年反而是黄金大牛市。</p>
    <h3 class="h3">实际利率与黄金ETF${big("g_c4","美国 10 年期实际利率（左轴 %）与黄金ETF（右轴）")}</h3>
    <p class="note" style="margin:0 0 6px"><span style="color:var(--div);font-weight:700">——</span> 实际利率（%，左轴）　<span style="color:var(--ink);font-weight:700">——</span> 黄金ETF（右轴）。2022 年以前两条线基本反着走，之后一起涨。</p>${box("g_c4",220)}
    <p class="concl"><b>结论：</b>实际利率能解释已经发生的涨跌，不能预测，不用来判断买卖。</p>
    <p style="margin-top:14px"><b>金银比</b>（现在在近 5 年 ${R.ratio_pct==null?"—":pc(R.ratio_pct)} 分位）</p>
    <p class="note" style="margin-top:0">金价 ÷ 银价很低（白银相对强）时，2020~2021 年三次之后黄金都跌了，但 2024 年和 2025~2026 年两次没有应验，时灵时不灵，不用。</p>
    <p style="margin-top:14px"><b>期货持仓（CFTC）</b></p>
    <p class="note" style="margin-top:0">投机盘做多最拥挤之后，金价反而继续涨，和“拥挤就反着做”的说法相反（这段样本主要是牛市），不用。</p>`;
  const lt4=ticks(Math.min(...ry.filter(v=>v!=null)),Math.max(...ry.filter(v=>v!=null)));
  DualChart($("g_c4"),{W:720,H:220,dates,leftRange:[lt4[0],lt4[lt4.length-1]],leftTicks:lt4,leftFmt:v=>v.toFixed(1)+"%",
    left:[{v:ry,c:"var(--div)",w:1.5}],right:{v:px,c:"var(--ink)"},tip:i=>`${dates[i]}<br>实际利率 <b>${ry[i]==null?"—":ry[i].toFixed(2)+"%"}</b><br>黄金ETF ${px[i].toFixed(3)}`});
  // ⑤ 对比表
  const U=(t,c)=>`<span class="use lv ${c}">${t}</span>`;
  const rows=[["ETF 资金撤出（≥8%）",T.outflow,U("用","g1")],["ETF 资金涌入（≥8%）",T.inflow,U("参考","c0")],["10 个月均线上方",T.above,U("看方向","c0")],["10 个月均线下方",T.below,U("看方向","c0")],
    ["波动很大",T.vol_hot,U("看风险","h1")],["离最高点 ≥15%（现行 2 倍）",T.dd15,U("现行规则","g1")],["比年线高 >25%（现行暂停）",T.hot25,U("现行规则","h1")],["金银比 ≤20% 分位",T.ratio_low,U("不用","r1")],["对照：任意一天",T.all,""]];
  $("s5").innerHTML=`<p class="note" style="margin:-6px 0 8px">黄金ETF ${S[0][0].slice(0,4)} 年起，每个交易日按当时状态分组，看之后半年（120 个交易日）：</p>
    <div class="scroll"><table><thead><tr><th>状态</th><th class="r">之后半年</th><th class="r">最多再跌</th></tr></thead><tbody>
    ${rows.map(([n,v,u])=>`<tr><td style="white-space:normal">${n} ${u}<br><small class="note">${v.days} 天</small></td><td class="r num">${h6(v)}</td><td class="r num">${v.dd==null?"—":pc(v.dd,1)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note">同一段行情里的天数互相重叠，独立次数不多；黄金 ETF 2013 年才上市，这次 −30% 以上的回撤在历史里没出现过。只作参考。</p>`;
  document.querySelectorAll(".bigbtn").forEach(b=>b.addEventListener("click",()=>openBig(b.dataset.big,b.dataset.title)));
}).catch(e=>{$("now").innerHTML=`<div class="note">读取失败：${e.message}</div>`});
})();
</script>
</body></html>
