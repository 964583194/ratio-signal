<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=360">
<title>分享图</title>
<link rel="stylesheet" href="style.css?v=4">
<style>
/* 小红书 3:4 竖图：360×480（截图时放大 3 倍 = 1080×1440）。只用浅色 */
:root{color-scheme:light;--bg:#f4efe6;--panel:#fffdf8;--ink:#1b2430;--muted:#6b6f76;--line:#e4dccd;
  --grow:#2f8f5b;--grow-soft:#dcefe3;--div:#c98a12;--div-soft:#fbeec8;--mid:#ece7de;--mark:#c8372d;--mark-soft:#f7dcd8;--y1:#fdf3d6;--y2:#f8e39a;--y3:#efc95a}
html,body{margin:0;padding:0;background:var(--bg)}
.card{width:360px;height:480px;overflow:hidden;padding:18px 18px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:6px}
.hd h1{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.15}
.hd .d{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row{display:flex;align-items:center;gap:10px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.score small{font-size:14px;color:var(--muted);font-weight:400}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:700;font-size:13px}
.g{background:var(--grow-soft);color:var(--grow)}.y{background:var(--div-soft);color:var(--div)}.r{background:var(--mark-soft);color:var(--mark)}.c{background:var(--mid);color:var(--ink)}
.todo{font-size:14px;font-weight:700;margin-top:4px}
.mini{width:100%;border-collapse:collapse;font-size:12px}
.mini td,.mini th{padding:2px 2px!important;line-height:1.3;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.mini th{color:var(--muted);font-weight:400}
.mini .r_{text-align:right;font-family:var(--f-num)}
.ft{margin-top:auto;font-size:10px;color:var(--muted);line-height:1.4;display:flex;justify-content:space-between;gap:8px}
.lbl{font-size:11px;color:var(--muted)}
.chartbox svg{display:block;width:100%;height:auto}
.zb{display:flex;gap:2px;margin:6px 0 4px}.zb div{flex:1;text-align:center;font-size:11px;padding:3px 0;border-radius:4px;background:var(--mid);color:var(--muted)}
.zb .on{font-weight:700;color:#fff}.zb .z0.on,.zb .z1.on{background:var(--grow)}.zb .z2.on{background:#7b8794}.zb .z3.on{background:var(--div)}.zb .z4.on{background:var(--mark)}
.plist{display:flex;flex-direction:column}
.plist .it{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.35}
.plist .it:last-child{border-bottom:0}
.plist .n{font-weight:700}
.tipx{font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="charts.js?v=5"></script>
<script>
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),K=Q.get("card")||"div";
const J=f=>fetch("data/"+f+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null);
const pc=(x,d=1)=>(x*100).toFixed(d)+"%",sg=x=>(x>0?"+":"")+pc(x);
const WD=d=>"周"+"日一二三四五六"[new Date(d+"T00:00:00+08:00").getDay()];
const FT=`<div class="ft"><span>个人指数定投记录，按规则自动计算<br>不构成投资建议</span><span>交易系统</span></div>`;
// 和红利页同一套档位
const TI=[[18,5,"加码","g"],[16,4,"加码","g"],[14,3,"加码","g"],[12,2,"多买 · 买回","g"],[10,1,"正常","c"],[8,.5,"少买","y"],[6.0001,0,"空仓","c"],[4.0001,0,"减仓 25%","r"],[2.0001,0,"减仓 33%","r"],[-99,0,"减仓 50%","r"]];
const tier=v=>TI.find(t=>v>=t[0]);

function divCard(d){
  const L=d.latest,S=d.series,ES=L.eff??L.score,t=tier(ES);
  const todo=ES<=6?"到减仓线，今天分批卖出":L.buy_next&&L.buy_amt?`连跌 2 天了 → 明天把攒的 ${L.buy_amt} 元一起买`
    :L.amount>0?(L.owed>0?`先攒着（已攒 ${L.owed} 元），等指数连跌 2 天一起买`:`今天起先攒着，等指数连跌 2 天一起买`):"评分偏低，暂停买入，钱先存着";
  const R=S.slice(-5),rows=R.slice(1).reverse().map((x,k)=>{const p=R[R.length-2-k],c=x[2]/p[2]-1,tt=tier(x[3]??x[1]);
    const what=x[4]>0?`买 ${x[4]} 元`:x[5]>0?`${tt[2]} · 已攒 ${x[5]}`:tt[2];
    return `<tr><td class="num">${x[0].slice(5)}</td><td class="r_">${x[1].toFixed(2)}</td><td><span class="pill ${x[4]>0?"g":tt[3]}" style="font-size:11px;padding:0 6px">${what}</span></td><td class="r_" style="color:${c>0?"var(--mark)":"var(--grow)"}">${c>0?"+":""}${pc(c)}</td></tr>`}).join("");
  $("card").innerHTML=`<div class="hd"><h1>红利低波100<br>今天买多少</h1><div class="d">${L.date}<br>${WD(L.date)} 收盘后</div></div>
    <div class="box"><div class="row"><div class="score">${L.score.toFixed(2)}<small> / 20</small></div><div><span class="pill ${t[3]}">${t[2]}${t[1]?` · ${t[1]} 倍`:""}</span><div class="lbl" style="margin-top:4px">分越高越便宜、买越多</div></div></div>
      <div class="todo">→ ${todo}</div></div>
    <div class="box chartbox" style="padding:6px 8px"><div class="lbl">近一年：评分（黑）和指数（红）几乎反着走</div><svg id="c" viewBox="0 0 480 128"></svg></div>
    <div class="box" style="padding:6px 10px"><table class="mini"><tr><th>日期</th><th class="r_">评分</th><th>当天</th><th class="r_">指数</th></tr>${rows}</table></div>
    ${FT}`;
  const X=S.slice(-250);
  DualChart($("c"),{W:480,H:128,dates:X.map(x=>x[0]),leftRange:[0,20],leftTicks:[0,8,12,20],leftFmt:v=>v,
    bands:[{from:12,to:20,fill:"var(--grow-soft)"},{from:0,to:8,fill:"var(--mid)"}],
    left:[{v:X.map(x=>x[1]),c:"var(--ink)",w:1.4}],right:{v:X.map(x=>x[2]),c:"var(--mark)"},tip:()=>""});
}

function weekCard(st,T,C){
  const L=T.latest,z=L.z,ZN=["底部","偏冷","正常","偏热","顶部"];
  const NM=[["创业板轮动","创业板"],["科创板轮动","科创板"],["红利打分","红利低波"],["A500 / 沪深300","A500"],["黄金","黄金"],["纳指100","纳指100"],["债基","债基"]];
  const brief=(k,a)=>{a=a.split(/；距|（阈值|（只作/)[0].replace(/^本周定投款/,"");
    if(/^买红利低波100（暂停/.test(a))return "暂停，这部分买红利低波100";
    if(k==="纳指100")return a.split("；")[0]+(/场外/.test(a)?"，买场外联接（场内溢价高）":"");
    if(k==="债基")return a.replace(/^利率比近一年均值低，/,"");
    return a.replace(/（已攒 0 元，/,"（").replace(/先攒着（(.+)）$/,"先攒着，$1").replace(/红利低波100 连跌/,"连跌")};
  // 黄金只写现在的位置，暂时不给建议
  const line=k=>k==="黄金"?`${st[k].now.split("；")[0]}<span style="color:var(--muted)"> · 暂不给建议</span>`:brief(k,st[k].act);
  const items=NM.filter(([k])=>st[k]).map(([k,n])=>`<div class="it"><div class="n">${n}</div><div>${line(k)}</div></div>`).join("");
  const cb=C&&C.latest,cl=cb&&(cb.level==="积极"?"g":cb.level==="谨慎"?"r":"c");
  const date=st["创业板轮动"]?.date||L.date;
  $("card").innerHTML=`<div class="hd"><h1>本周定投<br>怎么做</h1><div class="d">${date}<br>周五下单</div></div>
    <div class="box"><div class="lbl">市场温度</div><div class="zb">${ZN.map((n,i)=>`<div class="z${i}${i===z?" on":""}">${n}</div>`).join("")}</div>
      <div class="tipx">见底灯 <b>${L.bottom.count}/6</b> · 见顶灯 <b>${L.top.count}/7</b> · 方向${L.dir?.label||"—"}${cb?` · 综合 <span class="pill ${cl}" style="font-size:11px;padding:0 6px">${cb.level}</span>`:""}<br>→ <b>${L.action}</b></div></div>
    <div class="box" style="padding:4px 12px"><div class="plist">${items}</div></div>
    ${FT}`;
}

(async()=>{
  if(K==="week"){const [st,T,C]=await Promise.all([J("state.json"),J("temp.json"),J("combo.json")]);weekCard(st,T,C);document.body.dataset.date=st["创业板轮动"]?.date||T.latest.date}
  else{const d=await J("dividend.json");divCard(d);document.body.dataset.date=d.latest.date}
  document.body.dataset.ready=1;
})();
</script>
</body>
</html>
